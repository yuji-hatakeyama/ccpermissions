[project]
name = "ccpermissions"
version = "0.1.0"
description = "Token-matching Bash permission gate for Claude Code (PreToolUse hook)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Yuji Hatakeyama" },
]
keywords = ["claude-code", "permissions", "hooks", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pyyaml==6.0.2",
  "bashlex==0.18",
]

[project.urls]
Homepage = "https://github.com/yuji-hatakeyama/ccpermissions"
Repository = "https://github.com/yuji-hatakeyama/ccpermissions"
Issues = "https://github.com/yuji-hatakeyama/ccpermissions/issues"

[dependency-groups]
dev = [
  "pytest==8.3.4",
]

[project.scripts]
# Endpoint-specific console scripts: the suffix names the host the hook
# protocol targets. Future hosts get their own entry (e.g. ccpermissions-codex)
# rather than an --endpoint flag, so the launcher stays declarative.
ccpermissions-claude-code = "ccpermissions.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ccpermissions"]
