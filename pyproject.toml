[project]
name = "ccpermissions"
version = "0.1.0"
description = "Token-matching Bash permission gate for Claude Code (PreToolUse hook)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Yuji Hatakeyama" },
]
keywords = ["claude-code", "permissions", "hooks", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pyyaml==6.0.3",
  "bashlex==0.18",
]

[project.urls]
Homepage = "https://github.com/yuji-hatakeyama/ccpermissions"
Repository = "https://github.com/yuji-hatakeyama/ccpermissions"
Issues = "https://github.com/yuji-hatakeyama/ccpermissions/issues"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff>=0.15.22",
]

[tool.uv.dependency-groups]
# pytest 9 (GHSA-6w46-j5rx-g56g fix) needs Python >= 3.10; dev-only, so the
# package keeps supporting 3.9.
dev = { requires-python = ">=3.10" }

[tool.ruff]
line-length = 90
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
# Endpoint-specific console scripts: the suffix names the host the hook
# protocol targets. Future hosts get their own entry (e.g. ccpermissions-codex)
# rather than an --endpoint flag, so the launcher stays declarative.
ccpermissions-claude-code = "ccpermissions.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ccpermissions"]
