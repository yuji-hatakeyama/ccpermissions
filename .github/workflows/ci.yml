name: CI

on:
  push:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ruff lint
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "check ."
      - name: Ruff format check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "format --check --diff ."

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
      - name: Sync dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest
